ext {
    // Plan §2.5: minSdk 29 (Android 10) — Trichrome packaging is what keeps
    // WebView version-locked to Chrome and Play-updatable, which is what
    // makes WebCodecs/OPFS/WebGL2 presence predictable. ~87% device reach.
    minSdkVersion = 29
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // kneecap M4 (corpus 08 §8): Media3 Transformer drives the short-GOP
    // preview-proxy transcode on import. Latest stable per
    // dl.google.com/dl/android/maven2 as of this session (2026-08-17).
    media3Version = '1.11.0'
    // kneecap M9: `EdlParser` (app/src/main/.../edl/EdlParser.kt) parses
    // with plain `org.json`, but `android.jar`'s org.json on the unit-test
    // classpath is a method-stub ("not mocked") build, not a real
    // implementation — Android's own documented gap
    // (developer.android.com/r/studio-ui/build/not-mocked). A real
    // `org.json:json` on `testImplementation` shadows that stub for JVM unit
    // tests only (never ships in the app APK, which always uses the
    // platform's real org.json at runtime) — the standard, widely-used fix,
    // not a new toolchain.
    orgJsonVersion = '20231013'
}