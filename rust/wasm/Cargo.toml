[package]
name = "opencut-wasm"
version = "0.2.10"
edition = "2024"
description = "Shared video editor logic compiled to WebAssembly"
repository = "https://github.com/opencut/opencut"
license = "MIT"

[lib]
path = "src/wasm.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge = { version = "0.1.0", path = "../crates/bridge" }
compositor = { version = "0.1.0", path = "../crates/compositor" }
console_error_panic_hook = "0.1.7"
effects = { version = "0.1.0", path = "../crates/effects" }
gpu = { version = "0.1.0", path = "../crates/gpu", features = ["wasm"] }
js-sys = "0.3.93"
masks = { version = "0.1.0", path = "../crates/masks" }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
time = { version = "0.1.0", path = "../crates/time", features = ["wasm"] }
wasm-bindgen = "0.2.116"
wasm-bindgen-futures = "0.4.66"
web-sys = { version = "0.3.93", features = ["OffscreenCanvas", "HtmlCanvasElement", "CanvasRenderingContext2d", "Document", "Window", "Performance"] }

[features]
default = ["wasm"]
wasm = []

# wasm-pack's bundled wasm-opt cannot handle what current Rust emits for
# wasm32-unknown-unknown: on Linux it rejects the second table that reference
# types produce ("Only 1 table definition allowed in MVP"), and the macOS
# binary is older still and does not even know the feature flags that would
# let it parse the module. The pkg/ output is committed and consumed via a
# file: dependency, so CI only builds this crate as a workspace health check;
# skip the optimizer rather than fail on every push. Revisit if pkg/ is ever
# regenerated for release and binary size matters.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
