name: bugfix-lab-verify

# Temporary, workflow_dispatch-only clone of mobile-ci.yml's android-debug-build
# job, used ONLY to run kneecap's own Android build/tests against this fix
# branch (fix/kneecap-android-gradle-download-timeout) for LAB.md's FIX-protocol
# "when the oracle returns 0, run the repo's own build/tests" step.
# mobile-ci.yml itself only triggers on push/pull_request to main, so it can't
# be exercised from a fix branch without a PR; this file exists so we can
# verify build/tests BEFORE opening one. Deleted before the PR is opened.

on:
  workflow_dispatch: {}
  push:
    branches: [fix/kneecap-android-gradle-download-timeout]

jobs:
  android-debug-build:
    name: Android (debug APK) — bugfix-lab verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: gradlew testDebugUnitTest
        run: ./gradlew testDebugUnitTest --console=plain
        working-directory: apps/mobile/android

      - name: gradlew assembleDebug
        run: ./gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android
