name: Release (signed direct-distribution artifacts)

# kneecap M12/M13 — plan M13's OPERATIVE section (ratified 2026-08-17: no
# app-store release on either platform). On a `v*.*.*` tag push, this
# workflow:
#   1. Re-runs the exact same invariants gate bun-ci.yml runs on every
#      push to main (via `workflow_call` — see that file), so a release
#      can never ship on top of a red build. Nothing here duplicates that
#      job's steps.
#   2. Builds a SIGNED Android release APK. The signing keystore is
#      supplied entirely via repo secrets (ANDROID_KEYSTORE_BASE64 +
#      three password/alias secrets) — see docs/RELEASING.md for the
#      one-time setup a human does locally with `keytool` and
#      `gh secret set`. This workflow generates no secret material.
#   3. Builds an UNSIGNED iOS device build, packaged as a plain .ipa.
#      There is no CI-held Apple signing identity and no App Store /
#      TestFlight path (plan M13). The .ipa is installable via
#      AltStore/SideStore's free-Apple-ID re-sign-on-install flow; the
#      from-source alternative that needs no CI artifact at all is
#      docs/guides/ios-xcode-build.md.
#   4. Attaches both artifacts (+ a SHA256SUMS.txt) to a GitHub Release
#      on the pushed tag, via the `gh` CLI that's preinstalled on
#      GitHub-hosted runners — no third-party release action.
#
# This workflow has NOT had a real GitHub Actions run (no tag has been
# pushed). What HAS been verified directly, locally, in this session,
# against the real toolchains: `./gradlew assembleRelease` with the same
# four env vars this workflow sets, against a throwaway local test
# keystore, produces an APK that `apksigner verify` confirms is
# genuinely signed — and the same build without those env vars still
# succeeds (unsigned, different output filename — see
# docs/RELEASING.md); and the exact `apps/mobile/scripts/build-ios-
# unsigned-ipa.sh` this workflow calls, run standalone, produces a real
# arm64 Mach-O App.app and a validly-structured Payload/App.app .ipa.
# What's NOT verified: the workflow-as-a-whole in GitHub Actions itself
# (job graph, artifact hand-off between jobs, `gh release create`) — see
# docs/RELEASING.md §3 for the full breakdown.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  invariants:
    name: invariants gate
    uses: ./.github/workflows/bun-ci.yml

  android-release:
    name: Android (signed release APK)
    needs: invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Build the mobile web harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repo secret is not set — see docs/RELEASING.md for one-time keystore setup." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: gradlew assembleRelease (signed)
        env:
          KNEECAP_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          KNEECAP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KNEECAP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KNEECAP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
        working-directory: apps/mobile/android

      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -print -quit 2>/dev/null || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under build-tools (ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME)" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
        working-directory: apps/mobile/android

      - name: Stage release artifact
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release-artifacts/kneecap-${{ github.ref_name }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error

  ios-release:
    name: iOS (unsigned device build .ipa)
    needs: invariants
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned .ipa
        env:
          IOS_RELEASE_REF_NAME: ${{ github.ref_name }}
          IOS_UNSIGNED_OUT_DIR: ${{ github.workspace }}/release-artifacts
        run: bash scripts/build-ios-unsigned-ipa.sh
        working-directory: apps/mobile

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: release-artifacts/*.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Flatten artifact layout + checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find downloaded -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} release-artifacts/ \;
          (cd release-artifacts && shasum -a 256 -- * > SHA256SUMS.txt)
          ls -la release-artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            release-artifacts/* \
            --title "kneecap ${{ github.ref_name }}" \
            --notes "Direct-distribution build — no app store release (plan M13, ratified 2026-08-17).

          - **Android:** signed APK. Sideload install — see \`docs/guides/android-sideload.md\`.
          - **iOS:** unsigned \`.ipa\`. Install via AltStore/SideStore (free Apple ID, 7-day re-sign), or build from source via Xcode — see \`docs/guides/ios-xcode-build.md\`.

          \`SHA256SUMS.txt\` is included for artifact verification."
