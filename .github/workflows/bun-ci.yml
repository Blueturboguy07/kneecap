name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
  # kneecap M12 — lets .github/workflows/release.yml call this exact
  # matrix as its pre-release gate (`uses: ./.github/workflows/bun-ci.yml`)
  # instead of duplicating the invariants job. Adding this trigger changes
  # nothing about how push/pull_request runs behave.
  workflow_call: {}

jobs:
  invariants:
    name: invariants (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every OS reports its own result. With the default (fail-fast: true)
      # one failing OS cancelled the other two, so from Aug to Nov 2026 the
      # Windows and macOS jobs almost never reached invariants.sh. The run
      # still fails when any one of the three fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      # The Windows runner's git has core.autocrlf=true, so a checkout turns
      # every LF file into CRLF. The apps/mobile/test source-text tests then
      # compare CRLF text with LF strings (run 43760429027: 13 extra failures
      # on Windows only). Check out the bytes as committed, as on ubuntu and
      # macOS.
      - name: Keep line endings as committed (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned. With "latest" the action asks the GitHub API without a
          # token; a rate-limited reply has no tag_name and the action then
          # falls back to v0.9.1 (run 43760429027, macOS). That old
          # wasm-pack writes bundler glue that breaks the Next.js prerender
          # ("Cannot read properties of undefined (reading
          # 'TICKS_PER_SECOND')"). v0.15.1 is what "latest" gave on ubuntu
          # and Windows in the same run.
          version: v0.15.1

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build WASM (rust/ workspace health check)
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # bun.lock lives at the repo root (this is a Bun workspaces
          # monorepo, not a per-app lockfile) — apps/web/bun.lock does not
          # exist, so hashing it (the pre-fork key) always missed the cache.
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        # Workspace-aware install: must run from the repo root (where the
        # "workspaces" field lives), not apps/web — bun resolves the whole
        # monorepo graph into root node_modules regardless of cwd, but
        # scripts/invariants.sh explicitly checks for node_modules at the
        # repo root and fails fast with a clear message if it's missing.
        run: bun install

      - name: "invariants.sh: build, typecheck, lint, unit tests, offline audit, bridge-import gate, mouse-event gate"
        shell: bash
        run: bash scripts/invariants.sh
