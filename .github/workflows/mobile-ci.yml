name: Mobile CI

# kneecap M3 — plan M3 exit criterion: "CI produces a signed APK and an
# installable iOS build (ad-hoc or unsigned .ipa) from a clean checkout."
# This workflow covers the unsigned/debug half of that (iOS simulator build
# with CODE_SIGNING_ALLOWED=NO, Android debug APK via gradle) — the same two
# builds verified locally in the M3 session. Real device/ad-hoc signing for
# direct distribution (plan §8.0 item 5: no App Store / Play Store release)
# is M12/M13 scope; this job's iOS build intentionally targets the
# Simulator, not a device, for exactly the reason the plan gives for doing
# that from an agent session: "local signing is flaky from agent sessions —
# real signing happens in CI" still needs a signing identity + provisioning
# profile that only exists once M13 wires distribution certs into secrets.

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ios-simulator-build:
    name: iOS (simulator, unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync ios
        # Copies www/ into ios/App/App/public and updates the plugin list —
        # both gitignored, regenerated here on every run (see
        # apps/mobile/.gitignore's comment on why).
        run: bunx cap sync ios
        working-directory: apps/mobile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: xcodebuild (Debug, iphonesimulator, CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: apps/mobile/ios/App

  android-debug-build:
    name: Android (debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36, build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Build the M3 shell harness (apps/mobile/www)
        run: bun run build
        working-directory: apps/mobile

      - name: cap sync android
        run: bunx cap sync android
        working-directory: apps/mobile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}

      - name: gradlew testDebugUnitTest
        # kneecap M4: the Android-framework-free helpers in
        # app/src/main/java/dev/kneecap/app/media/MediaMath.kt (rotation
        # normalization, frame-rate rationalization, GOP/mime helpers) run as
        # plain JVM unit tests — no emulator needed. The rest of M4's media
        # pipeline (MediaProbe/ThumbnailStripGenerator/MediaImporter/
        # MediaPickerIntents) is instrumentation-only (app/src/androidTest)
        # and is NOT run here — ubuntu-latest runners have no Android
        # emulator; see the M4 handoff for why that verification is still
        # open.
        run: ./gradlew testDebugUnitTest --console=plain
        working-directory: apps/mobile/android

      - name: gradlew assembleDebug
        run: ./gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kneecap-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
